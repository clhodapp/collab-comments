name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "26.1"
          - "26.3"
          - "27.2"
          - "28.2"
          - "29.4"
          - "30.1"
          - "31.1"
          - "snapshot"
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - run: make

  # MELPA's checks (package-lint, checkdoc) and a package-build of the
  # checkout the way MELPA builds it, on one current Emacs.  The full
  # history is needed so the stable channel can see release tags.
  melpa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - run: make lint melpa
